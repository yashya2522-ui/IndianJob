<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IndianJob Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header span {
            color: #38bdf8;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000010;
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 15px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            margin-top: 12px;
            color: #2563eb;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px #00000010;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 19px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Indian<span>Job</span> Admin</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="stats">
        <div class="stat-card">
            <h3>Total Jobs</h3>
            <p id="totalJobs">0</p>
        </div>

        <div class="stat-card">
            <h3>Government Jobs</h3>
            <p id="govJobs">0</p>
        </div>

        <div class="stat-card">
            <h3>Private Jobs</h3>
            <p id="privateJobs">0</p>
        </div>
    </div>

    <div class="section">
        <h2>➕ Add New Job</h2>

        <form id="jobForm">

            <div class="form-grid">

                <input id="title" placeholder="Job Title" required>

                <input id="department" placeholder="Department / Company" required>

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Government">Government</option>
                    <option value="Private">Private</option>
                </select>

                <input id="qualification" placeholder="Qualification" required>

                <input id="salary" placeholder="Salary">

                <input id="location" placeholder="Location">

                <input id="vacancies" type="number" placeholder="Vacancies">

                <input id="lastDate" type="date" required>

                <input id="applicationFee" placeholder="Application Fee">

                <input id="officialApplyLink" type="url"
                    placeholder="Official Apply Link" required>

                <input id="officialNotification" type="url"
                    placeholder="Official Notification PDF Link">

                <select id="status">
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                </select>

            </div>

            <button class="add-btn" type="submit">Add Job</button>

            <p id="message"></p>

        </form>
    </div>

    <div class="section">
        <h2>📋 All Jobs</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Job Title</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="jobsTable">
                    <tr>
                        <td colspan="5">Loading jobs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
const API = "https://indianjob-backend.onrender.com";

// ADMIN TOKEN
const token = localStorage.getItem("adminToken");

// LOGIN CHECK
if (!token) {
    window.location.href = "admin-login.html";
}

// LOAD JOBS
async function loadJobs() {
    try {
        const response = await fetch(`${API}/api/jobs`);
        const jobs = await response.json();

        document.getElementById("totalJobs").textContent = jobs.length;

        document.getElementById("govJobs").textContent =
            jobs.filter(job => job.category === "Government").length;

        document.getElementById("privateJobs").textContent =
            jobs.filter(job => job.category === "Private").length;

        const table = document.getElementById("jobsTable");

        if (jobs.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="5">No Jobs Available</td>
                </tr>
            `;
            return;
        }

        table.innerHTML = jobs.map(job => `
            <tr>
                <td>${job.title}</td>
                <td>${job.category}</td>
                <td>${job.location}</td>
                <td>${job.status}</td>
                <td>
                    <button class="delete-btn"
                    onclick="deleteJob('${job._id}')">
                    Delete
                    </button>
                </td>
            </tr>
        `).join("");

    } catch (error) {
        console.error(error);
    }
}

// ADD JOB
document.getElementById("jobForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const job = {
        title: document.getElementById("title").value,
        department: document.getElementById("department").value,
        category: document.getElementById("category").value,
        qualification: document.getElementById("qualification").value,
        salary: document.getElementById("salary").value,
        location: document.getElementById("location").value,
        vacancies: Number(document.getElementById("vacancies").value || 0),
        lastDate: document.getElementById("lastDate").value,
        applicationFee: document.getElementById("applicationFee").value,
        officialApplyLink: document.getElementById("officialApplyLink").value,
        officialNotification: document.getElementById("officialNotification").value,
        status: document.getElementById("status").value
    };

    try {
        const response = await fetch(`${API}/api/admin/jobs`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(job)
        });

        const result = await response.json();

        document.getElementById("message").textContent = result.message;

        if (response.ok) {
            document.getElementById("jobForm").reset();
            loadJobs();
        }

    } catch (error) {
        document.getElementById("message").textContent = "Server Error";
    }
});

// DELETE JOB

    async function deleteJob(id) {
    const confirmDelete = confirm("Are you sure you want to delete this job?");

    if (!confirmDelete) return;

    try {
        const response = await fetch(`${API}/api/admin/jobs/${id}`, {
            method: "DELETE",
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        const result = await response.json();

        if (response.ok) {
            alert("Job deleted successfully!");
            loadJobs();
        } else {
            alert(result.message || "Delete failed");
        }

    } catch (error) {
        alert("Server error");
    }
}

// LOGOUT
function logout() {
    localStorage.removeItem("adminToken");
    window.location.href = "admin-login.html";
}

// INITIAL LOAD
loadJobs();
</script>

</body>
</html>
